name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 22.22.0
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify tag matches package version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$package_version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm clean-install

      - name: Lint code with standard
        run: npm run lint

      - name: Run tests
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 22.22.0
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Set up npm for trusted publishing
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm clean-install

      - name: Publish to npm
        run: npm publish
